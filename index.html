<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<title>Pangrazzi: The Neighbor Game</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
html, body { margin: 0; height: 100%; background: #0d0f24; }
body { display: flex; align-items: center; justify-content: center; overflow: hidden; }
#wrap { position: relative; width: min(100vw, calc(100vh * 240 / 135)); aspect-ratio: 240 / 135; }
canvas { width: 100%; height: 100%; display: block; image-rendering: pixelated; image-rendering: crisp-edges; cursor: pointer; touch-action: manipulation; }
#name { position: absolute; display: none; box-sizing: border-box; padding: 0; outline: none;
  background: #14173a; color: #fff7d6; border: 2px solid #f5c518; font-family: monospace; font-weight: bold;
  text-transform: uppercase; text-align: center; }
</style>
</head>
<body>
<div id="wrap">
  <canvas id="c" width="240" height="135"></canvas>
  <input id="name" maxlength="10" autocomplete="off" spellcheck="false">
</div>
<script src="pixel-font.js"></script>
<script src="admins-art.js"></script>
<script src="game.js"></script>
</body>
</html>
